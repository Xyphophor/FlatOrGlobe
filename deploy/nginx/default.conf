# Site statique Vite. Les liens profonds sont des ancres (#tab-…) : pas de repli SPA.
# headers.conf et env.conf sont écrits au démarrage par 40-site-env.sh (dans /tmp/site) ;
# add_header ne s'hérite pas d'un niveau à l'autre dans nginx, d'où l'include dans chaque location.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain text/markdown;
    # mode IA (epic20) : llms.txt et /ai/*.md lisibles tels quels, accents compris
    charset utf-8;
    charset_types text/plain text/markdown text/css application/javascript application/json;

    # /video/ relayé vers le stockage de médias (écrit par 40-site-env.sh, vide sans MEDIA_UPSTREAM)
    include /tmp/site/media.conf;

    # fichiers à empreinte de Vite : jamais modifiés, cache d'un an
    location /assets/ {
        include /tmp/site/headers.conf;
        include /tmp/site/env.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    # photos et vidéo (public/) : un jour
    location ~ ^/(photos|video)/ {
        include /tmp/site/headers.conf;
        include /tmp/site/env.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }
    location = /robots.txt {
        include /tmp/site/headers.conf;
        add_header Cache-Control "no-cache" always;
        default_type text/plain;
        alias /tmp/site/robots.txt;
    }
    # mode IA : nginx ne connaît pas .md (il servirait application/octet-stream, à télécharger)
    location ~ \.md$ {
        include /tmp/site/headers.conf;
        include /tmp/site/env.conf;
        add_header Cache-Control "no-cache" always;
        default_type text/markdown;
        types { }
        try_files $uri =404;
    }
    # sondes k8s
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    # index.html, version.txt : toujours revalidés, pour qu'une mise à jour se voie tout de suite
    location / {
        include /tmp/site/headers.conf;
        include /tmp/site/env.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
