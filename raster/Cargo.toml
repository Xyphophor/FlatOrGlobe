[package]
name = "raster"
version = "0.1.0"
edition = "2021"
description = "Canvas 2D rasterizer for the figures (wasm, C ABI): replays an op stream written by src/core/ctx-record.js"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
csscolorparser = "0.9.0"
tiny-skia = "0.11"
ttf-parser = "0.25.1"
